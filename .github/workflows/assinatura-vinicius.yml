name: Generate Vinicius signature images
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gerar_assinatura_vinicius.py
      - .github/workflows/assinatura-vinicius.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/gerar_assinatura_vinicius.py
      - name: Commit hosted signature images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assinaturas/vinicius/identidade.png assinaturas/vinicius/telefone.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Vinicius signature assets"
          git push
