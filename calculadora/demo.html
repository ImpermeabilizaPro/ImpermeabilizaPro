<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pré-visualização interna | Calculadora</title><style>body{font:16px system-ui;background:#f1f5f9;color:#12324b;padding:20px}.box{max-width:580px;margin:auto;background:white;border-radius:16px;padding:25px}label{display:block;margin:16px 0 6px}input[type=number],select{width:100%;padding:10px;box-sizing:border-box}button{background:#123b61;color:white;padding:12px 20px;border:0;border-radius:8px;margin-top:20px}#result{margin-top:18px;font-weight:bold}.notice{color:#915b12}</style></head><body><main class="box"><p class="notice">TESTE INTERNO — não publicar preços antes da validação técnica e fiscal.</p><h1>Calculadora experimental</h1><form id="form"><label for="service">Serviço</label><select id="service"><option value="bituminous_single">Tela asfáltica: uma camada</option><option value="bituminous_double">Tela asfáltica: duas camadas</option><option value="liquid_membrane">Membrana líquida</option><option value="cementitious_flexible">Membrana cimentícia</option><option value="terrace_moderate_preparation">Terraço com preparação moderada</option></select><label for="area">Área aproximada (m²)</label><input id="area" type="number" min="1" max="10000" step="0.1" required><label><input id="complex" type="checkbox"> Base degradada ou origem da infiltração desconhecida</label><label><input id="difficult" type="checkbox"> Acesso difícil / altura</label><button type="submit">Calcular intervalo</button></form><p id="result" role="status" aria-live="polite"></p><small>Preços sem IVA, apenas para testes internos. Não constitui orçamento.</small></main><script type="module">import {estimate} from './engine.mjs';const cfg=await fetch('./config.preliminar.json').then(r=>r.json());document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const v=estimate({service:document.querySelector('#service').value,area:document.querySelector('#area').value,complex:document.querySelector('#complex').checked,difficultAccess:document.querySelector('#difficult').checked},cfg);document.querySelector('#result').textContent=v.review?'Avaliação técnica necessária: '+v.reason:'Intervalo experimental: '+v.min.toLocaleString('pt-PT')+' € a '+v.max.toLocaleString('pt-PT')+' € (sem IVA).';});</script></body></html>
